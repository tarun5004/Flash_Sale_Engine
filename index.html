<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Flash Sale — Limited Stock Engine</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts: Clean e-commerce typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- ============================================================
         TOP NAVIGATION BAR
         Fixed, Myntra-style header with logo, search, and actions
         ============================================================ -->
    <header id="topNav" class="top-nav">
        <div class="nav-inner">
            <a href="#" class="nav-logo" onclick="navigateTo('home'); return false;">
                ⚡ <span>FlashSale</span>
            </a>

            <div class="nav-search">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
                </svg>
                <input type="text" id="searchInput" placeholder="Search for products, brands and more...">
            </div>

            <nav class="nav-actions">
                <button class="nav-btn" id="navHome" onclick="navigateTo('home')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    <span>Home</span>
                </button>
                <button class="nav-btn" id="navCart" onclick="navigateTo('cart')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
                    <span>Cart</span>
                    <span id="cartBadge" class="cart-badge hidden">0</span>
                </button>
            </nav>
        </div>
    </header>

    <!-- ============================================================
         FLASH SALE COUNTDOWN BANNER
         Creates urgency — core flash-sale UX pattern
         ============================================================ -->
    <section class="sale-strip">
        <div class="sale-strip-inner">
            <span class="sale-tag">⚡ FLASH SALE</span>
            <span class="sale-msg">Ends in</span>
            <div class="timer" id="saleTimer">
                <div class="timer-block"><span id="timerH">00</span><small>hrs</small></div>
                <span class="timer-sep">:</span>
                <div class="timer-block"><span id="timerM">00</span><small>min</small></div>
                <span class="timer-sep">:</span>
                <div class="timer-block"><span id="timerS">00</span><small>sec</small></div>
            </div>
            <span class="sale-msg-right">Limited stock · No restocking</span>
        </div>
    </section>

    <!-- ============================================================
         CATEGORY FILTER CHIPS
         Horizontal scroll on mobile — Myntra pattern
         ============================================================ -->
    <section id="categorySection" class="category-section">
        <div class="category-scroll" id="categoryScroll">
            <!-- Chips injected by JS -->
        </div>
    </section>

    <!-- ============================================================
         PAGE: HOME / PRODUCT LISTING GRID
         Main product browse experience
         ============================================================ -->
    <main id="pageHome" class="page">
        <div class="page-header">
            <h2 id="listingTitle">All Products</h2>
            <p id="listingCount" class="listing-count"></p>
        </div>
        <div id="productGrid" class="product-grid">
            <!-- Product cards injected by JS -->
        </div>
        <div id="emptyState" class="empty-state hidden">
            <p>😕 No products found</p>
        </div>
    </main>

    <!-- ============================================================
         PAGE: PRODUCT DETAIL
         Opens when user clicks a product card
         ============================================================ -->
    <section id="pageDetail" class="page hidden">
        <div id="detailContent" class="detail-layout">
            <!-- Injected by JS -->
        </div>
    </section>

    <!-- ============================================================
         PAGE: CART
         Shows items user wants to buy
         ============================================================ -->
    <section id="pageCart" class="page hidden">
        <div id="cartContent" class="cart-layout">
            <!-- Injected by JS -->
        </div>
    </section>

    <!-- ============================================================
         TOAST NOTIFICATION
         Quick feedback for user actions (added/removed/error)
         ============================================================ -->
    <div id="toast" class="toast hidden" role="alert"></div>

    <!-- ============================================================
         MAIN APPLICATION SCRIPT
         ============================================================ -->
    <script src="app.js"></script>
</body>
</html>
